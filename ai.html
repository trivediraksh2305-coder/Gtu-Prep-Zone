<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTU Prep Zone AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --sidebar: #f7f7f8;
            --sidebar-hover: #e9e9eb;
            --border: #e5e5e5;
            --text: #202123;
            --muted: #707070;
            --input: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --message-user: #f1f5f9;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        body.dark {
            --bg: #111214;
            --sidebar: #18191c;
            --sidebar-hover: #292b30;
            --border: #303238;
            --text: #f5f5f5;
            --muted: #a5a5a5;
            --input: #1c1e22;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --message-user: #25282d;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            width: 270px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            transition: width 0.25s ease, transform 0.25s ease;
            flex-shrink: 0;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 17px;
        }

        .ai-logo {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            color: white;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.25);
        }

        .brand-text {
            line-height: 1.1;
        }

        .brand-text span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: var(--muted);
            margin-top: 3px;
        }

        .close-sidebar {
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 21px;
            cursor: pointer;
            padding: 5px;
            display: none;
        }

        .new-chat {
            width: 100%;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 10px;
            padding: 11px 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .new-chat:hover {
            background: var(--sidebar-hover);
        }

        .new-chat-icon {
            font-size: 20px;
            font-weight: 400;
        }

        .recent-title {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin: 25px 8px 10px;
            letter-spacing: 0.5px;
        }

        .recent-chats {
            overflow-y: auto;
            flex: 1;
            padding-right: 2px;
        }

        .recent-chat {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text);
            padding: 9px 8px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            margin-bottom: 3px;
            position: relative;
        }

        .recent-chat:hover {
            background: var(--sidebar-hover);
        }

        .recent-chat.active {
            background: var(--sidebar-hover);
        }

        .chat-icon {
            font-size: 15px;
            opacity: 0.75;
            flex-shrink: 0;
        }

        .chat-title {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex: 1;
            cursor: text;
        }

        .chat-title-input {
            background: transparent;
            border: 1px solid var(--primary);
            border-radius: 4px;
            color: var(--text);
            font-size: 13px;
            padding: 2px 6px;
            flex: 1;
            outline: none;
            font-family: inherit;
        }

        .chat-actions {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
        }

        .chat-action-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 5px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.2s;
            line-height: 1;
        }

        .recent-chat:hover .chat-action-btn {
            opacity: 1;
        }

        .chat-action-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        body.dark .chat-action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-action-btn.delete:hover {
            color: #ef4444;
        }

        .chat-action-btn.rename:hover {
            color: var(--primary);
        }

        .no-chats {
            color: var(--muted);
            font-size: 12px;
            padding: 8px;
            line-height: 1.5;
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 10px;
        }

        .sidebar-option {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 13px;
        }

        .sidebar-option:hover {
            background: var(--sidebar-hover);
        }

        /* =========================
           MAIN
        ========================== */

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg);
        }

        .topbar {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            justify-content: space-between;
        }

        .menu-btn {
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 23px;
            cursor: pointer;
            display: none;
        }

        .page-title {
            font-size: 15px;
            font-weight: 600;
        }

        .top-status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 35px 20px 160px;
        }

        .welcome {
            max-width: 850px;
            margin: 50px auto 0;
            text-align: center;
        }

        .welcome-logo {
            width: 70px;
            height: 70px;
            border-radius: 22px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            font-weight: 800;
            margin: auto;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
        }

        .welcome h1 {
            margin-top: 22px;
            font-size: 32px;
            letter-spacing: -0.5px;
        }

        .welcome p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 15px;
        }

        .suggestions {
            max-width: 850px;
            margin: 35px auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .suggestion {
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            padding: 16px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .suggestion:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .suggestion-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .suggestion-text {
            color: var(--muted);
            font-size: 12px;
        }

        .input-container {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 15px 20px 20px;
            background: linear-gradient(transparent, var(--bg) 30%);
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            border: 1px solid var(--border);
            background: var(--input);
            border-radius: 17px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .attachment-area {
            display: none;
            padding: 10px 12px 0;
        }

        .attachment {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 8px;
            background: var(--sidebar);
            border: 1px solid var(--border);
            font-size: 12px;
        }

        .attachment-name {
            max-width: 250px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .remove-file {
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 16px;
        }

        .message-input {
            width: 100%;
            min-height: 52px;
            max-height: 160px;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            padding: 15px 15px 7px;
            font-family: inherit;
            font-size: 14px;
        }

        .message-input::placeholder {
            color: var(--muted);
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 9px 9px;
        }

        .input-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            width: 36px;
            height: 36px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .action-btn:hover {
            background: var(--sidebar-hover);
            color: var(--text);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .send-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .file-input {
            display: none;
        }

        .disclaimer {
            max-width: 850px;
            margin: 8px auto 0;
            text-align: center;
            color: var(--muted);
            font-size: 10px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 25px;
            display: flex;
            gap: 12px;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            color: white;
        }

        .user-message .message-avatar {
            background: var(--message-user);
            color: var(--text);
        }

        .message-content {
            flex: 1;
            padding-top: 6px;
            font-size: 14px;
            line-height: 1.65;
            min-width: 0;
        }

        .message-role {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .user-question {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .attached-pdf {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--sidebar);
            max-width: 100%;
        }

        .pdf-name {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
        }

        .msg-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .message:hover .msg-actions {
            opacity: 1;
        }

        .msg-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 9px;
            font-size: 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .msg-action-btn:hover {
            background: var(--sidebar);
            color: var(--text);
        }

        .edit-textarea {
            width: 100%;
            min-height: 60px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.6;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--bg);
            color: var(--text);
            resize: vertical;
        }

        .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .edit-save-btn {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .edit-cancel-btn {
            padding: 6px 14px;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }

        .ai-heading {
            margin: 18px 0 8px;            line-height: 1.4;
        }

        .ai-list {
            margin: 8px 0 12px 22px;
            padding-left: 18px;
        }

        .ai-list li {
            margin: 4px 0;
            line-height: 1.6;
        }

        .ai-code {
            margin: 12px 0;
            padding: 14px;
            border-radius: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            background: #111827;
            color: #f9fafb;
        }

        .ai-code code {
            font-family: Consolas, Monaco, monospace;
        }

        .message-content strong {
            font-weight: 700;
        }

        .message-content em {
            font-style: italic;
        }

        .message-content h2,
        .message-content h3 {
            line-height: 1.4;
        }

        .message-content ul,
        .message-content ol {
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4 {
            margin: 18px 0 8px;
            line-height: 1.4;
            font-weight: 700;
        }

        .message-content h1 { font-size: 19px; }
        .message-content h2 { font-size: 17px; }
        .message-content h3 { font-size: 15px; }
        .message-content h4 { font-size: 14px; }

        .message-content p {
            margin: 8px 0;
        }

        .message-content li {
            margin: 4px 0;
            line-height: 1.6;
        }

        .message-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
            font-size: 13.5px;
        }

        .message-content th,
        .message-content td {
            border: 1px solid var(--border);
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
        }

        .message-content th {
            background: var(--sidebar);
            font-weight: 700;
        }

        .message-content pre {
            margin: 12px 0;
            padding: 14px;
            border-radius: 10px;
            overflow-x: auto;
            line-height: 1.5;
            background: #111827;
            color: #f9fafb;
        }

        .message-content pre code {
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
        }

        .message-content code {
            font-family: Consolas, Monaco, monospace;
            background: var(--sidebar);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 13px;
        }

        .message-content pre code {
            background: transparent;
            padding: 0;
        }

        .message-content blockquote {
            margin: 10px 0;
            padding: 4px 14px;
            border-left: 3px solid var(--border);
            color: var(--muted);
        }

        .message-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 16px 0;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 750px) {
            .sidebar {
                position: fixed;
                z-index: 100;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                box-shadow: var(--shadow);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .close-sidebar {
                display: block;
            }

            .menu-btn {
                display: block;
            }

            .topbar {
                padding: 0 15px;
                gap: 15px;
            }

            .top-status {
                display: none;
            }

            .welcome {
                margin-top: 30px;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .suggestions {
                grid-template-columns: 1fr;
                margin-top: 25px;
            }

            .chat-area {
                padding-left: 14px;
                padding-right: 14px;
            }

            .input-container {
                padding: 10px;
            }

            .chat-action-btn {
                opacity: 1;
            }
        }

        body.sidebar-hidden .sidebar {
            width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
        }

        body.sidebar-hidden .main {
            width: 100%;
        }

    </style>

    <!-- Real markdown renderer + sanitizer, so AI answers (tables, headings, lists, etc.) render properly instead of raw text -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="brand">
                <div class="ai-logo">AI</div>
                <div class="brand-text">
                    GTU Prep Zone
                    <span>AI Assistant</span>
                </div>
            </div>

            <button class="close-sidebar" onclick="toggleSidebar()" title="Close sidebar">×</button>

        </div>

        <!-- NEW CHAT -->

        <button class="new-chat" onclick="newChat()">
            <span class="new-chat-icon">＋</span>
            <span>New chat</span>
        </button>

        <!-- RECENT CHATS -->

        <div class="recent-title">Recent chats</div>

        <div class="recent-chats" id="recentChats"></div>

        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <button class="sidebar-option" onclick="toggleTheme()">
                <span id="themeIcon">☾</span>
                <span id="themeText">Dark mode</span>
            </button>

        </div>

    </aside>

    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <!-- TOP BAR -->

        <header class="topbar">

            <button class="menu-btn" onclick="toggleSidebar()" title="Open sidebar">☰</button>

            <div class="page-title">GTU AI Assistant</div>

            <div class="top-status">
                <span class="status-dot"></span>
                AI Ready
            </div>

        </header>

        <!-- =========================
             CHAT AREA
        ========================== -->

        <section class="chat-area" id="chatArea">

            <!-- WELCOME -->

            <div class="welcome" id="welcome">

                <div class="welcome-logo">AI</div>

                <h1>How can I help with your GTU exam?</h1>

                <p>Upload your GTU question paper and ask for exam-ready answers.</p>

            </div>

            <!-- SUGGESTIONS -->

            <div class="suggestions" id="suggestions">

                <button class="suggestion" onclick="useSuggestion('Explain Question 3 in GTU exam pattern')">
                    <div class="suggestion-title">📝 Solve a question</div>
                    <div class="suggestion-text">Get a detailed GTU-style answer.</div>
                </button>

                <button class="suggestion" onclick="useSuggestion('Give me a 7-mark answer for this question')">
                    <div class="suggestion-title">🎯 7-mark answer</div>
                    <div class="suggestion-text">Generate an answer according to marks.</div>
                </button>

                <button class="suggestion" onclick="useSuggestion('Explain this topic in simple language')">
                    <div class="suggestion-title">💡 Explain simply</div>
                    <div class="suggestion-text">Understand difficult concepts easily.</div>
                </button>

                <button class="suggestion" onclick="useSuggestion('Give important points for exam preparation')">
                    <div class="suggestion-title">📚 Exam preparation</div>
                    <div class="suggestion-text">Get important points from your paper.</div>
                </button>

            </div>

        </section>

        <!-- =========================
             INPUT
        ========================== -->

        <div class="input-container">

            <div class="input-box">

                <!-- ATTACHED PDF -->

                <div class="attachment-area" id="attachmentArea">

                    <div class="attachment">

                        <span>📄</span>

                        <span class="attachment-name" id="attachmentName"></span>

                        <button class="remove-file" onclick="removeFile()" title="Remove PDF">×</button>

                    </div>

                </div>

                <!-- TEXT -->

                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    placeholder="Ask anything about your GTU question paper..."
                    oninput="handleInput()"
                    onkeydown="handleKey(event)"></textarea>

                <!-- ACTIONS -->

                <div class="input-actions">

                    <div class="input-left">

                        <input type="file" id="pdfInput" class="file-input" accept=".pdf" onchange="handleFile(event)">

                        <button class="action-btn" onclick="document.getElementById('pdfInput').click()" title="Upload PDF">＋</button>

                    </div>

                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button>

                </div>

            </div>

            <div class="disclaimer">
                GTU Prep Zone AI can make mistakes. Always verify important exam information.
            </div>

        </div>

    </main>

</div>

<script>

/* =========================
   CONSTANTS
========================= */

const STORAGE_KEY = 'gtu_conversations_permanent';

/* =========================
   CURRENT CHAT PAPER
========================= */

let paperUploaded = false;
let paperText = ""; // holds extracted PDF text so it can be resent on follow-up questions
const API_BASE_URL = "http://127.0.0.1:5000"; // TODO: replace after deploying to Render
let currentPdfName = null;

// Tracks each Q&A exchange so a question can be edited and re-answered later.
// Each entry: { id, text, pdfFile (File object or null), pdfName }
let chatTurns = [];
let turnCounter = 0;

/* =========================
   THEME
========================= */

function toggleTheme() {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("gtuTheme", isDark ? "dark" : "light");
    updateThemeButton();
}

function updateThemeButton() {
    const isDark = document.body.classList.contains("dark");
    document.getElementById("themeIcon").textContent = isDark ? "☀" : "☾";
    document.getElementById("themeText").textContent = isDark ? "Light mode" : "Dark mode";
}

/* LOAD SAVED THEME */
if (localStorage.getItem("gtuTheme") === "dark") {
    document.body.classList.add("dark");
}
updateThemeButton();

/* =========================
   CHAT STORAGE - PERMANENT
========================= */

// Get conversations from localStorage, or empty array if none
function getConversations() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) return [];
    try {
        const parsed = JSON.parse(stored);
        return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
        console.error('Error parsing conversations:', e);
        return [];
    }
}

// Save conversations to localStorage
function saveConversations(conversations) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
        // Verify save was successful
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
            console.error('Failed to save to localStorage');
        }
    } catch (e) {
        console.error('Error saving conversations:', e);
        // Try to save with a different key as backup
        try {
            localStorage.setItem('gtu_backup_' + Date.now(), JSON.stringify(conversations));
        } catch (e2) {
            console.error('Backup save also failed:', e2);
        }
    }
}

let conversations = getConversations();
let currentConversationId = null;

/* =========================
   SIDEBAR
========================= */

function toggleSidebar() {
    if (window.innerWidth <= 750) {
        document.getElementById("sidebar").classList.toggle("open");
    } else {
        document.body.classList.toggle("sidebar-hidden");
    }
}

/* =========================
   CHAT HISTORY
========================= */

function loadRecentChats() {
    const container = document.getElementById("recentChats");
    if (!container) return;
    
    // RELOAD from localStorage
    conversations = getConversations();
    
    container.innerHTML = "";
    
    if (conversations.length === 0) {
        container.innerHTML = `<div class="no-chats">No recent chats yet.</div>`;
        return;
    }
    
    // Sort by newest first (by creation date)
    conversations.sort((a, b) => {
        return new Date(b.createdAt) - new Date(a.createdAt);
    });
    
    conversations.forEach(conversation => {
        const item = document.createElement("div");
        item.className = "recent-chat";
        if (conversation.id === currentConversationId) {
            item.classList.add("active");
        }
        
        const titleSpan = document.createElement("span");
        titleSpan.className = "chat-title";
        titleSpan.textContent = conversation.title || "Untitled Chat";
        
        const actionsDiv = document.createElement("div");
        actionsDiv.className = "chat-actions";
        
        const renameBtn = document.createElement("button");
        renameBtn.className = "chat-action-btn rename";
        renameBtn.textContent = "✏️";
        renameBtn.title = "Rename chat";
        renameBtn.onclick = function(e) {
            e.stopPropagation();
            startRename(conversation.id);
        };
        
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "chat-action-btn delete";
        deleteBtn.textContent = "×";
        deleteBtn.title = "Delete chat";
        deleteBtn.onclick = function(e) {
            e.stopPropagation();
            deleteConversation(conversation.id);
        };
        
        actionsDiv.appendChild(renameBtn);
        actionsDiv.appendChild(deleteBtn);
        
        const iconSpan = document.createElement("span");
        iconSpan.className = "chat-icon";
        iconSpan.textContent = "💬";
        item.appendChild(iconSpan);
        item.appendChild(titleSpan);
        item.appendChild(actionsDiv);
        
        item.addEventListener("click", function(e) {
            if (e.target.closest(".chat-action-btn")) return;
            openConversation(conversation.id);
        });
        
        container.appendChild(item);
    });
}

/* =========================
   RENAME CHAT
========================= */

function startRename(id) {
    conversations = getConversations();
    const conversation = conversations.find(c => c.id === id);
    if (!conversation) return;
    
    const allItems = document.querySelectorAll(".recent-chat");
    let targetItem = null;
    for (const item of allItems) {
        const titleSpan = item.querySelector(".chat-title");
        if (titleSpan && titleSpan.textContent === conversation.title) {
            targetItem = item;
            break;
        }
    }
    
    if (!targetItem) return;
    
    const titleSpan = targetItem.querySelector(".chat-title");
    const currentTitle = titleSpan.textContent;
    
    const input = document.createElement("input");
    input.type = "text";
    input.className = "chat-title-input";
    input.value = currentTitle;
    input.maxLength = 50;
    
    titleSpan.replaceWith(input);
    input.focus();
    input.select();
    
    function saveRename() {
        const newTitle = input.value.trim() || currentTitle;
        conversation.title = newTitle;
        saveConversations(conversations);
        loadRecentChats();
        if (currentConversationId === id) {
            const items = document.querySelectorAll(".recent-chat");
            for (const item of items) {
                const titleSpan = item.querySelector(".chat-title");
                if (titleSpan && titleSpan.textContent === newTitle) {
                    item.classList.add("active");
                    break;
                }
            }
        }
    }
    
    input.addEventListener("blur", saveRename);
    input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            input.blur();
        }
        if (e.key === "Escape") {
            input.value = currentTitle;
            input.blur();
        }
    });
}

/* =========================
   DELETE CHAT
========================= */

function deleteConversation(id) {
    if (!confirm("Delete this chat permanently?")) return;
    
    conversations = getConversations();
    conversations = conversations.filter(conversation => conversation.id !== id);
    saveConversations(conversations);
    
    if (currentConversationId === id) {
        currentConversationId = null;
        paperUploaded = false;
        currentPdfName = null;
        resetChatInterface();
    }
    
    loadRecentChats();
}

/* =========================
   OPEN CHAT
========================= */

function openConversation(id) {
    conversations = getConversations();
    const conversation = conversations.find(c => c.id === id);
    if (!conversation) return;
    
    currentConversationId = conversation.id;
    const chatArea = document.getElementById("chatArea");
    chatArea.innerHTML = "";
    
    paperUploaded = conversation.paperUploaded || false;
    currentPdfName = conversation.pdfName || null;
    paperText = conversation.paperText || "";

    // Rebuild chatTurns so Edit/Regenerate keep working after reload
    chatTurns = [];

    if (conversation.messages && conversation.messages.length > 0) {
        conversation.messages.forEach(message => {
            const turnId = ++turnCounter;
            chatTurns.push({
                id: turnId,
                text: message.user,
                pdfFile: null, // the original File object can't survive a reload; regenerate still works since paperText is preserved
                pdfName: message.pdf || currentPdfName
            });
            addStoredUserMessage(message, turnId);
            addStoredAIMessage(message, turnId);
        });
    }
    
    chatArea.scrollTop = chatArea.scrollHeight;
    loadRecentChats();
    
    if (window.innerWidth <= 750) {
        document.getElementById("sidebar").classList.remove("open");
    }
}

/* =========================
   STORED USER MESSAGE
========================= */

function addStoredUserMessage(message, turnId) {
    const chatArea = document.getElementById("chatArea");
    const userMessage = document.createElement("div");
    userMessage.className = "message user-message";
    userMessage.dataset.turn = turnId;
    userMessage.innerHTML = `
        <div class="message-avatar">You</div>
        <div class="message-content">
            <div class="message-role">You</div>
            <div class="user-question">${escapeHTML(message.user)}</div>
            ${message.pdf ? `
                <div class="attached-pdf">
                    <span>📄</span>
                    <span class="pdf-name">${escapeHTML(message.pdf)}</span>
                </div>
            ` : ""}
            <div class="msg-actions">
                <button class="msg-action-btn" onclick="editMessage(${turnId})">✎ Edit</button>
            </div>
        </div>
    `;
    chatArea.appendChild(userMessage);
}

/* =========================
   STORED AI MESSAGE
========================= */

function addStoredAIMessage(message, turnId) {
    const chatArea = document.getElementById("chatArea");
    const aiMessage = document.createElement("div");
    aiMessage.className = "message";
    aiMessage.dataset.turn = turnId;
    aiMessage.innerHTML = `
        <div class="message-avatar">AI</div>
        <div class="message-content">
            <div class="message-role">GTU AI</div>
            <div>${formatAIAnswer(message.answer)}</div>
        </div>
    `;
    chatArea.appendChild(aiMessage);
    addRegenerateButton(aiMessage, turnId);
}

/* =========================
   RESET CHAT INTERFACE
========================= */

        <div class="welcome" id="welcome">
            <div class="welcome-logo">AI</div>
            <h1>How can I help with your GTU exam?</h1>

        </div>

            </button>
            <button class="suggestion" onclick="useSuggestion('Give me a 7-mark answer for this question')">
                <div class="suggestion-title">🎯 7-mark answer</div>
                <div class="suggestion-text">Generate an answer according to marks.</div>
            </button>
            <button class="suggestion" onclick="useSuggestion('Explain this topic in simple language')">
                <div class="suggestion-title">💡 Explain simply</div>

            </button>

/* =========================
   NEW CHAT
========================= */

function newChat() {
    // Clear UI
    const chatMessages = document.getElementById('chatMessages');
    if (chatMessages) {
        chatMessages.innerHTML = '';
    }
    
    // Clear file input
    removeFile();
    
    // Reset flags (no server session anymore - paper text lives only in this page's memory)
    paperUploaded = false;
    paperText = "";
    
    // Show welcome message
    showWelcomeMessage();
}

function showWelcomeMessage() {
    const chatMessages = document.getElementById('chatMessages');
    if (!chatMessages) return;
    
    const welcomeDiv = document.createElement('div');
    welcomeDiv.className = 'welcome-message';
    welcomeDiv.style.textAlign = 'center';
    welcomeDiv.style.padding = '40px 20px';
    welcomeDiv.style.color = '#666';
    welcomeDiv.innerHTML = `
        <h3>👋 Welcome to GTU AI Assistant</h3>
        <p>Upload a GTU question paper and ask any question about it!</p>
        <p style="font-size: 14px; color: #999;">Click the + button to upload a PDF</p>
    `;
    chatMessages.appendChild(welcomeDiv);
}

/* =========================
   PDF UPLOAD
========================= */

function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.type !== "application/pdf") {
        alert("Please select a PDF file.");
        event.target.value = "";
        return;
    }
    currentPdfName = file.name;
    document.getElementById("attachmentName").textContent = file.name;
    document.getElementById("attachmentArea").style.display = "block";
    handleInput();
}

function removeFile() {
    document.getElementById("pdfInput").value = "";
    document.getElementById("attachmentArea").style.display = "none";
    document.getElementById("attachmentName").textContent = "";
    paperUploaded = false;
    currentPdfName = null;
    handleInput();
}

/* =========================
   INPUT
========================= */

function handleInput() {
    const input = document.getElementById("messageInput");
    const send = document.getElementById("sendBtn");
    send.disabled = input.value.trim().length === 0;
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

function handleKey(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

/* =========================
   SUGGESTION
========================= */

function useSuggestion(text) {
    const input = document.getElementById("messageInput");
    input.value = text;
    handleInput();
    input.focus();
}

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    const pdfInput = document.getElementById("pdfInput");

    if (!text) {
        return;
    }

    const pdfFile = pdfInput.files.length ? pdfInput.files[0] : null;
    const pdfName = pdfFile ? pdfFile.name : currentPdfName;

    const welcome = document.getElementById("welcome");
    const suggestions = document.getElementById("suggestions");
    if (welcome) welcome.remove();
    if (suggestions) suggestions.remove();

    const turnId = ++turnCounter;
    chatTurns.push({ id: turnId, text: text, pdfFile: pdfFile, pdfName: pdfName });

    input.value = "";
    handleInput();

    await runTurn(turnId, text, pdfFile, pdfName, /*isNewTurn*/ true);
}

/* =========================
   RUN / RE-RUN A SINGLE Q&A TURN
   Renders (or replaces) the user bubble + AI bubble for one turn and
   calls the backend. Used both for new messages and for edit/regenerate.
========================= */

async function runTurn(turnId, text, pdfFile, pdfName, isNewTurn) {
    const chatArea = document.getElementById("chatArea");
    const sendBtn = document.getElementById("sendBtn");

    if (isNewTurn) {
        // USER MESSAGE
        const userMessage = document.createElement("div");
        userMessage.className = "message user-message";
        userMessage.dataset.turn = turnId;
        userMessage.innerHTML = `
            <div class="message-avatar">You</div>
            <div class="message-content">
                <div class="message-role">You</div>
                <div class="user-question">${escapeHTML(text)}</div>
                ${!paperUploaded && pdfFile ? `
                    <div class="attached-pdf">
                        <span>📄</span>
                        <span class="pdf-name">${escapeHTML(pdfFile.name)}</span>
                    </div>
                ` : ""}
                <div class="msg-actions">
                    <button class="msg-action-btn" onclick="editMessage(${turnId})">✎ Edit</button>
                </div>
            </div>
        `;
        chatArea.appendChild(userMessage);

        // AI LOADING MESSAGE
        const aiMessage = document.createElement("div");
        aiMessage.className = "message";
        aiMessage.dataset.turn = turnId;
        aiMessage.innerHTML = `
            <div class="message-avatar">AI</div>
            <div class="message-content">
                <div class="message-role">GTU AI</div>
                <div class="ai-loading">
                    ${paperUploaded ? "Thinking about your question..." : "Reading your question paper..."}
                    <br><br>
                    <span style="color:var(--muted);">Generating your GTU-style answer...</span>
                </div>
            </div>
        `;
        chatArea.appendChild(aiMessage);
    } else {
        // Re-running an existing turn (edit save / regenerate): reset its AI bubble to a loading state
        const aiMessage = chatArea.querySelector(`.message[data-turn="${turnId}"]:not(.user-message)`);
        aiMessage.innerHTML = `
            <div class="message-avatar">AI</div>
            <div class="message-content">
                <div class="message-role">GTU AI</div>
                <div class="ai-loading">
                    Generating a new answer...
                </div>
            </div>
        `;
    }

    const aiMessage = chatArea.querySelector(`.message[data-turn="${turnId}"]:not(.user-message)`);
    const loading = aiMessage.querySelector(".ai-loading");
    chatArea.scrollTop = chatArea.scrollHeight;

    sendBtn.disabled = true;
    sendBtn.textContent = "…";

    const formData = new FormData();
    formData.append("message", text);

    if (!paperUploaded && pdfFile) {
        formData.append("pdf", pdfFile);
    } else {
        // No new PDF this turn - send back the text extracted earlier
        formData.append("paper_text", paperText);
    }

    try {
        const response = await fetch(`${API_BASE_URL}/chat`, {
            method: "POST",
            body: formData
        });

        const responseText = await response.text();
        console.log("Raw backend response:", responseText);

        let data;
        try {
            data = JSON.parse(responseText);
        } catch (jsonError) {
            console.error("Invalid JSON received:", responseText);
            loading.innerHTML = `
                <span style="color:#ef4444;">
                    Server returned invalid response. Please check console for details.
                    <br><br>
                    <span style="font-size:12px;color:var(--muted);">
                        Raw: ${escapeHTML(responseText.substring(0, 200))}...
                    </span>
                </span>
            `;
            sendBtn.textContent = "↑";
            sendBtn.disabled = false;
            chatArea.scrollTop = chatArea.scrollHeight;
            return;
        }

        if (data.success) {
            loading.innerHTML = formatAIAnswer(data.answer);
            addRegenerateButton(aiMessage, turnId);

            if (!paperUploaded && pdfFile) {
                paperUploaded = true;
                currentPdfName = pdfFile.name;
                paperText = data.paper_text || ""; // remember for follow-up questions
                document.getElementById("pdfInput").value = "";
                document.getElementById("attachmentArea").style.display = "none";
                document.getElementById("attachmentName").textContent = "";
            }

            // SAVE TO CONVERSATIONS - PERMANENT
            saveConversationPermanent(text, data.answer, pdfName || currentPdfName);

        } else {
            loading.innerHTML = `
                <span style="color:#ef4444;">
                    ${escapeHTML(data.message || "Something went wrong.")}
                </span>
            `;
        }

    } catch (error) {
        console.error("Fetch error:", error);
        loading.innerHTML = `
            <span style="color:#ef4444;">
                Unable to connect to the AI server.
                <br><br>
                <span style="font-size:12px;color:var(--muted);">
                    Error: ${escapeHTML(error.message)}
                </span>
            </span>
        `;
    }

    sendBtn.textContent = "↑";
    sendBtn.disabled = false;
    chatArea.scrollTop = chatArea.scrollHeight;
}

/* =========================
   EDIT A SENT QUESTION
========================= */

function editMessage(turnId) {
    const chatArea = document.getElementById("chatArea");
    const userMessage = chatArea.querySelector(`.message.user-message[data-turn="${turnId}"]`);
    if (!userMessage) return;

    const turn = chatTurns.find(t => t.id === turnId);
    if (!turn) return;

    const contentDiv = userMessage.querySelector(".message-content");
    const originalHTML = contentDiv.innerHTML;

    contentDiv.innerHTML = `
        <div class="message-role">You</div>
        <textarea class="edit-textarea" id="editBox-${turnId}">${escapeHTML(turn.text)}</textarea>
        <div class="edit-actions">
            <button class="edit-save-btn" onclick="saveEdit(${turnId})">Save & Submit</button>
            <button class="edit-cancel-btn" onclick="cancelEdit(${turnId})">Cancel</button>
        </div>
    `;

    // Stash the original markup so Cancel can restore it exactly
    userMessage.dataset.originalHtml = encodeURIComponent(originalHTML);

    const box = document.getElementById(`editBox-${turnId}`);
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
}

function cancelEdit(turnId) {
    const chatArea = document.getElementById("chatArea");
    const userMessage = chatArea.querySelector(`.message.user-message[data-turn="${turnId}"]`);
    if (!userMessage) return;

    const contentDiv = userMessage.querySelector(".message-content");
    contentDiv.innerHTML = decodeURIComponent(userMessage.dataset.originalHtml);
}

async function saveEdit(turnId) {
    const box = document.getElementById(`editBox-${turnId}`);
    const newText = box.value.trim();
    if (!newText) return;

    const turn = chatTurns.find(t => t.id === turnId);
    if (!turn) return;

    turn.text = newText;

    const chatArea = document.getElementById("chatArea");
    const userMessage = chatArea.querySelector(`.message.user-message[data-turn="${turnId}"]`);
    const contentDiv = userMessage.querySelector(".message-content");

    contentDiv.innerHTML = `
        <div class="message-role">You</div>
        <div class="user-question">${escapeHTML(newText)}</div>
        ${!paperUploaded && turn.pdfFile ? `
            <div class="attached-pdf">
                <span>📄</span>
                <span class="pdf-name">${escapeHTML(turn.pdfFile.name)}</span>
            </div>
        ` : ""}
        <div class="msg-actions">
            <button class="msg-action-btn" onclick="editMessage(${turnId})">✎ Edit</button>
        </div>
    `;

    await runTurn(turnId, newText, turn.pdfFile, turn.pdfName, /*isNewTurn*/ false);
}

/* =========================
   REGENERATE AN AI ANSWER (same question, fresh answer)
========================= */

function addRegenerateButton(aiMessageEl, turnId) {
    const contentDiv = aiMessageEl.querySelector(".message-content");
    const actions = document.createElement("div");
    actions.className = "msg-actions";
    actions.innerHTML = `<button class="msg-action-btn" onclick="regenerateAnswer(${turnId})">⟳ Regenerate</button>`;
    contentDiv.appendChild(actions);
}

async function regenerateAnswer(turnId) {
    const turn = chatTurns.find(t => t.id === turnId);
    if (!turn) return;
    await runTurn(turnId, turn.text, turn.pdfFile, turn.pdfName, /*isNewTurn*/ false);
}



/* =========================
   SAVE CONVERSATION - PERMANENT
========================= */

function saveConversationPermanent(userMessage, aiAnswer, pdfName) {
    // Load latest from localStorage
    conversations = getConversations();
    
    const messageEntry = {
        user: userMessage,
        answer: aiAnswer,
        pdf: pdfName || null
    };

    if (currentConversationId) {
        // Update existing conversation
        const conversation = conversations.find(c => c.id === currentConversationId);
        if (conversation) {
            // Check for duplicate
            const lastMessage = conversation.messages[conversation.messages.length - 1];
            if (!lastMessage || lastMessage.user !== userMessage || lastMessage.answer !== aiAnswer) {
                conversation.messages.push(messageEntry);
                conversation.updatedAt = new Date().toISOString();
            }
            // Update title if needed
            if (conversation.messages.length > 0) {
                conversation.title = conversation.messages[0].user.substring(0, 50);
            }
            conversation.paperUploaded = paperUploaded;
            conversation.pdfName = currentPdfName || pdfName;
            conversation.paperText = paperText;
            
            saveConversations(conversations);
            loadRecentChats();
        }
    } else {
        // Create new conversation with unique ID
        const newConversation = {
            id: 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
            title: userMessage.substring(0, 50),
            messages: [messageEntry],
            paperUploaded: paperUploaded,
            pdfName: currentPdfName || pdfName,
            paperText: paperText,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };
        conversations.unshift(newConversation);
        currentConversationId = newConversation.id;
        
        saveConversations(conversations);
        loadRecentChats();
    }

    // Highlight active chat
    const items = document.querySelectorAll(".recent-chat");
    items.forEach(item => item.classList.remove("active"));
    const activeItems = document.querySelectorAll(".recent-chat");
    for (const item of activeItems) {
        const titleSpan = item.querySelector(".chat-title");
        if (titleSpan) {
            const conv = conversations.find(c => c.id === currentConversationId);
            if (conv && titleSpan.textContent === (conv.title || "Untitled Chat")) {
                item.classList.add("active");
                break;
            }
        }
    }
}

/* =========================
   SECURITY HELPER
========================= */

function escapeHTML(text) {
    if (!text) return "";
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

/* =========================
   FORMAT AI ANSWER
========================= */

function formatAIAnswer(answer) {
    if (!answer) return "";

    // marked converts full markdown (tables, headings, lists, code blocks,
    // bold/italic, horizontal rules) into HTML the same way ChatGPT/Claude do.
    marked.setOptions({ breaks: true, gfm: true });
    const rawHtml = marked.parse(answer);

    // DOMPurify strips anything unsafe before it's injected into the page.
    return DOMPurify.sanitize(rawHtml);
}
