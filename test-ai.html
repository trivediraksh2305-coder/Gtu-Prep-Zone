<!DOCTYPE html>
<html>
<head>
    <title>GTU AI Backend Test</title>
</head>

<body>

<h2>GTU AI Backend Test</h2>

<form id="testForm">

    <label>Select GTU PDF:</label>
    <br><br>

    <input
        type="file"
        id="pdf"
        accept=".pdf"
        required
    >

    <br><br>

    <label>Question:</label>
    <br><br>

    <textarea
        id="message"
        rows="5"
        cols="60"
        placeholder="Example: Explain Question 3 in GTU pattern for 7 marks."
        required
    ></textarea>

    <br><br>

    <button type="submit">
        Test AI
    </button>

</form>

<hr>

<h3>Response:</h3>

<pre id="result"></pre>


<script>

document
    .getElementById("testForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const pdf =
            document.getElementById("pdf").files[0];

        const message =
            document.getElementById("message").value.trim();

        const result =
            document.getElementById("result");

        if (!pdf) {

            result.textContent =
                "Please select a PDF.";

            return;

        }

        if (!message) {

            result.textContent =
                "Please enter a question.";

            return;

        }

        result.textContent =
            "Reading PDF and asking Groq... Please wait.";

        const formData =
            new FormData();

        formData.append(
            "pdf",
            pdf
        );

        formData.append(
            "message",
            message
        );


        try {

            const response =
                await fetch(
                    "api/chat.php",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            result.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        }

        catch (error) {

            result.textContent =
                "ERROR:\n\n" +
                error;

        }

    });

</script>

</body>
</html>
